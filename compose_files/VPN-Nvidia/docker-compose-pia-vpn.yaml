---
version: "3.3"
services:
  pia:
    container_name: GlueTun-VPN
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8082:8080
      - 8081:8081
      - 51420:51420
      - 51420:51420/udp
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - VPN_TYPE=openvpn
    restart: always
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:pia
    container_name: qbittorrent
    depends_on:
      - pia
    environment:
      - WEBUI_PORT=8081
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      #- DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - /jellyfin:/jellyfin
      - /jellyfin/configs/qbittorrent:/config
      - /jellyfin/qbittorrent/downloads:/downloads
    labels:
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8081
      - traefik.http.middlewares.qbittorrent-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.https-0-g084cg0ww8sokcoc0soskkkg-qbittorrent.middlewares=gzip,qbittorrent-headers
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      #- LANG=fr_FR
      #- LANG=en_US
    ports:
      - 8191:8191
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - /jellyfin/configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - /jellyfin/configs/jackett:/config
    ports:
      - 9117:9117
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - /jellyfin:/jellyfin
      - /jellyfin/configs/sonarr:/config
      - /jellyfin/sonarr/tv:/tv
      - /jellyfin/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - /jellyfin:/jellyfin
      - /jellyfin/configs/radarr:/config
      - /jellyfin/radarr/movies:/movies
      - /jellyfin/qbittorrent/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - /jellyfin:/jellyfin
      - /jellyfin/configs/jellyfin:/config
      - /jellyfin/jellyfin/cache:/cache
      - /jellyfin/sonarr/tv:/data/tvshows
      - /jellyfin/radarr/movies:/data/movies
      - /jellyfin/qbittorrent/downloads:/data/media_downloads
    labels:
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - /jellyfin/configs/jellyseerr:/app/config
    restart: unless-stopped
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - /jellyfin:/jellyfin
      - /jellyfin/configs/sonarr:/config
      - /jellyfin/readarr/books:/books
      - /jellyfin/qbittorrent/downloads:/downloads
    ports:
      - 8787:8787
    restart: unless-stopped
